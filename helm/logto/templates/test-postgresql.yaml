{{- if .Values.database.testPostgresql.enabled }}
{{- if .Values.database.existingSecret }}
{{- fail "database.testPostgresql.enabled and database.existingSecret are mutually exclusive" }}
{{- end }}
{{- if or .Values.autoscaling.enabled (ne (int .Values.replicaCount) 1) }}
{{- fail "test PostgreSQL requires one Logto replica and autoscaling disabled" }}
{{- end }}
{{- if .Values.database.migrateOnUpgrade }}
{{- fail "test PostgreSQL does not support migration hooks; reinstall the disposable release to test a new Logto version" }}
{{- end }}
{{- $name := include "logto.testPostgresqlName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $password := randAlphaNum 40 }}
{{- if $existing }}
{{- $password = required "existing test PostgreSQL Secret is missing POSTGRES_PASSWORD" (get $existing.data "POSTGRES_PASSWORD") | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "logto.chartLabels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ $password | b64enc | quote }}
  DB_URL: {{ printf "postgres://postgres:%s@%s:5432/logto" $password $name | b64enc | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "logto.chartLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "logto.testPostgresqlSelectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "logto.chartLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "logto.testPostgresqlSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "logto.testPostgresqlSelectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70 # postgres user in the Alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.database.testPostgresql.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: logto
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: [pg_isready, -h, '127.0.0.1', -U, postgres, -d, logto]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
