apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logto.fullname" . }}
  labels:
    {{- include "logto.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    {{- if or .Values.database.testPostgresql.enabled (eq .Values.strategy.type "Recreate") }}
    type: Recreate
    # Clear the API-defaulted RollingUpdate settings when switching strategies.
    rollingUpdate: null
    {{- else }}
    {{- toYaml .Values.strategy | nindent 4 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "logto.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "logto.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- include "logto.podOptions" . | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.database.testPostgresql.enabled }}
      initContainers:
        - name: wait-for-test-db
          image: {{ .Values.database.testPostgresql.image | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 60); do
                if psql -X -Atqc 'select 1' >/dev/null 2>&1; then exit 0; fi
                sleep 2
              done
              echo 'Test PostgreSQL is not accepting connections' >&2
              exit 1
          env:
            - name: PGHOST
              value: {{ include "logto.testPostgresqlName" . | quote }}
            - name: PGDATABASE
              value: logto
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "logto.testPostgresqlName" . | quote }}
                  key: POSTGRES_PASSWORD
            - name: PGCONNECT_TIMEOUT
              value: "2"
        - name: seed-test-db
          image: {{ include "logto.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["npm", "run", "cli", "--"]
          args: ["db", "seed", "--swe"]
          env:
            {{- include "logto.dbEnv" . | nindent 12 }}
            - name: npm_config_cache
              value: /tmp/npm
            - name: CI
              value: "true"
            {{- with .Values.database.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            {{- include "logto.writableMounts" . | nindent 12 }}
      {{- end }}
      containers:
        - name: logto
          image: {{ include "logto.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3001
            - name: admin
              containerPort: 3002
          env:
            {{- include "logto.dbEnv" . | nindent 12 }}
            - name: npm_config_cache
              value: /tmp/npm
            {{- with include "logto.redisEnv" . }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- with .Values.endpoint }}
            - name: ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.adminEndpoint }}
            - name: ADMIN_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.trustProxyHeader }}
            - name: TRUST_PROXY_HEADER
              value: "1"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/status
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "logto.writableMounts" . | nindent 12 }}
      volumes:
        {{- include "logto.writableVolumes" . | nindent 8 }}
